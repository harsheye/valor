[workspace]
members = [
    "crates/valor-core",
    "crates/valor-library",
    "crates/valor-skins",
    "crates/valor-ui",
    "crates/valor-app",
    "crates/valor-player",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
