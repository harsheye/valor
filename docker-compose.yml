name: valor-stack

services:
  postgres:
    container_name: valor_postgres
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-valor}
      POSTGRES_USER: ${POSTGRES_USER:-valor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ValorPass2026!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-valor_user} -d ${POSTGRES_DB:-valor}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - valor-net

  redis:
    container_name: valor_redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      sh -c "redis-server --requirepass \"$${REDIS_PASSWORD:-AdminPass2026!}\" --user \"$${REDIS_USER:-admin}\" on \">$${REDIS_PASSWORD:-AdminPass2026!}\" ~* &* +@all"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-AdminPass2026!}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 3s
    networks:
      - valor-net

volumes:
  postgres_data:
  redis_data:

networks:
  valor-net:
    name: valor-net
    driver: bridge
