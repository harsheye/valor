name: Valor Native CI

on:
  push:
    branches: [ main, production, RUST_IT_BABY ]
  pull_request:
    branches: [ main, production, RUST_IT_BABY ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libmpv-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libasound2-dev

      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install mpv

      - name: Setup libmpv on Windows
        if: runner.os == 'Windows'
        run: |
          powershell -ExecutionPolicy Bypass -File .\download-mpv.ps1
          Copy-Item "libmpv\libmpv-2.dll" -Destination "target\debug\" -Force -ErrorAction SilentlyContinue

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run All Workspace Unit & Integration Tests
        run: cargo test --workspace --verbose

      - name: Build Release Binaries
        run: cargo build --workspace --release
