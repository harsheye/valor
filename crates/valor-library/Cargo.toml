[package]
name = "valor-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
valor-core = { path = "../valor-core" }
blake3 = "1.5"
libmpv2 = "7.0.1"
libmpv2-sys = "4.0.1"
walkdir = "2.5"
notify = "6.1"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
parking_lot = "0.12"
thiserror = "2.0"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
