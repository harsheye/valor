[package]
name = "valor-library"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
valor-core = { path = "../valor-core" }
walkdir = "2.5"
rayon = "1.10"
notify = "6.1"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
parking_lot = "0.12"
thiserror = "2.0"
tracing = "0.1"
