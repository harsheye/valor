<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Valor Auto-Embed</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h2>Valor Embed</h2>
    
    <div class="setting-row">
      <label for="enableToggle">Enable Auto-Replace:</label>
      <label class="switch">
        <input type="checkbox" id="enableToggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="setting-row vertical">
      <label for="valorUrl">Valor Embed URL / Host:</label>
      <input type="text" id="valorUrl" placeholder="https://localhost/embed" />
      <div class="hint">Use HTTPS local server, Cloudflare tunnel, or remote player:</div>
      <div class="btn-group">
        <button type="button" id="btnHttps443" class="btn-preset" title="Local HTTPS (Port 443)">HTTPS 443</button>
        <button type="button" id="btnDevPort" class="btn-preset" title="Local Dev (Port 5173)">Dev 5173</button>
        <button type="button" id="btnAppPort" class="btn-preset" title="Service (Port 50000)">Port 50000</button>
        <button type="button" id="btnCustomPreset" class="btn-preset" title="Focus custom / remote URL input">Custom</button>
      </div>
    </div>

    <button id="saveBtn">Save Settings</button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
