<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Valor Companion</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="valor-popup-container">
    <!-- Top Header -->
    <header class="valor-header">
      <div class="valor-branding">
        <div class="valor-logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3" fill="#e50914" stroke="#e50914" />
          </svg>
        </div>
        <div class="valor-title-group">
          <div class="valor-title-row">
            <span class="valor-title">VALOR</span>
            <span class="valor-badge">PRO v2.4</span>
          </div>
          <span class="valor-subtitle">CYBERSTREAM COMPANION</span>
        </div>
      </div>
      <!-- Real-time Ping Indicator -->
      <div id="connStatus" class="valor-status-pill checking" title="Checking Valor Server connection...">
        <span class="status-dot"></span>
        <span class="status-label">PINGING...</span>
      </div>
    </header>

    <!-- Mode Selector Segmented Tabs -->
    <div class="section-title">INTELLIGENT EMBED MODE</div>
    <div class="segmented-control" id="modeSelector">
      <button type="button" class="seg-btn active" data-mode="badge" title="Show sleek 'Play in Valor' toggle on videos without forcing auto-switch">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
        <span>Play Toggle</span>
      </button>
      <button type="button" class="seg-btn" data-mode="auto" title="Force auto-switch all legitimate media players automatically">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Auto-Switch</span>
      </button>
      <button type="button" class="seg-btn" data-mode="off" title="Disable automatic embedding completely">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
        <span>Off</span>
      </button>
    </div>

    <!-- Page Media Sniffer (Live Stream Detection) -->
    <div class="section-header">
      <span class="section-title">PAGE MEDIA DETECTED</span>
      <button type="button" id="btnRescan" class="icon-action-btn" title="Rescan active page for streams">
        <svg id="rescanIcon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
      </button>
    </div>
    
    <div id="mediaSnifferList" class="media-sniffer-box">
      <div class="sniffer-empty">
        <span>Sniffing streams on current tab...</span>
      </div>
    </div>

    <!-- Valor Host / Port Configuration -->
    <div class="section-title">VALOR PLAYER HOST / URL</div>
    <div class="host-input-wrapper">
      <input type="text" id="valorUrlInput" spellcheck="false" placeholder="http://localhost:5173/embed" />
      <button type="button" id="btnTestConn" class="host-ping-btn" title="Test server ping">Test</button>
    </div>

    <!-- Quick Host Presets -->
    <div class="preset-pill-group">
      <button type="button" class="preset-pill" data-url="http://localhost:5173/embed">Dev 5173</button>
      <button type="button" class="preset-pill" data-url="http://localhost:50000/embed">Engine 50k</button>
      <button type="button" class="preset-pill" data-url="https://localhost/embed">HTTPS 443</button>
      <button type="button" class="preset-pill" data-url="http://localhost:80/embed">Port 80</button>
    </div>

    <!-- Playback Feature Toggles -->
    <div class="feature-toggles">
      <label class="feature-row">
        <div class="feature-text">
          <span class="feature-name">Seamless Location Resume</span>
          <span class="feature-sub">Preserve & restore exact playback timestamps</span>
        </div>
        <input type="checkbox" id="chkResume" checked />
        <span class="feature-switch"></span>
      </label>
      <label class="feature-row">
        <div class="feature-text">
          <span class="feature-name">Cinema Mode by Default</span>
          <span class="feature-sub">Dark ambient borderless canvas</span>
        </div>
        <input type="checkbox" id="chkCinema" />
        <span class="feature-switch"></span>
      </label>
    </div>

    <!-- Bottom Action Bar -->
    <footer class="valor-footer">
      <button type="button" id="btnSave" class="btn-save-primary">
        <span>Save & Apply Settings</span>
      </button>
      <div id="toastMessage" class="valor-toast"></div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
