<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Valor Embed Wrapper</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="valor-frame" allow="autoplay; fullscreen; encrypted-media"></iframe>
    <script src="embed.js"></script>
</body>
</html>
